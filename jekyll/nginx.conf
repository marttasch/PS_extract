server {
    listen 80;   # Change this to your desired port
    server_name localhost;   # Change this to your domain name

    root /usr/share/nginx/html;   # Change this to your web root directory
    index index.html;   # Change this to your default index file

    location / {
        try_files $uri $uri/ =404;   

        # Optional: Add basic authentication
        # Uncomment the following lines and customize if you want to restrict access
        # auth_basic "Restricted Access";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Enable gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_min_length 1000;
}
